# Optional blueprint — configure in Render dashboard if preferred.
services:
  - type: web
    name: build-flow
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install --prefix client && npm run build --prefix client && npm install --prefix server && rm -rf server/public && mkdir -p server/public && cp -r client/dist/. server/public/
    startCommand: npm start --prefix server
    envVars:
      - key: NODE_ENV
        value: production
